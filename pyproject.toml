[project]
name = "ai-agent-starter"
version = "0.1.0"
description = "W1-W2 实战项目：Python工程化 + 大模型API全栈基础（FastAPI + OpenAI兼容SDK + Function Calling + 结构化输出 + Token成本控制）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Deng Jingliang" }
]

dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # 数据校验与配置
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # 大模型 SDK（OpenAI 兼容，支持 DeepSeek / 硅基流动 / 通义 / Kimi / 豆包等）
    "openai>=1.50.0",
    # HTTP 客户端（工具调用示例用）
    "httpx>=0.27.0",
    # 工具
    "python-dotenv>=1.0.0",
    "rich>=13.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent_starter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
